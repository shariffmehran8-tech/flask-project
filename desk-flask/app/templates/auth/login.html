{% extends "base.html" %}
{% block title %}Log in — Deskline{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Log in</h1>
    <form method="post">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</div>
{% endblock %}
