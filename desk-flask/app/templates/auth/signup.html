{% extends "base.html" %}
{% block title %}Sign up — Deskline{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Create an account</h1>
    <p class="muted">Sign up as a customer to submit tickets, or as an agent to work the queue.</p>
    <form method="post">
        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="field">
            <label for="role">I am a</label>
            <select id="role" name="role">
                <option value="customer">Customer</option>
                <option value="agent">Support agent</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
